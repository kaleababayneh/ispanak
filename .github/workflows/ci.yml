# Her PR ve her main push'unda koşar. Amacı tek cümlede: bu depoda bulunan
# hataların çoğu "çökmüyor, sessizce yanlış çalışıyor" türünden olduğu için,
# korumanın da otomatik olması gerekiyor -- elle koşturulan bir kontrol,
# koşturulmadığı gün yok demektir.
#
# Aksiyon sürümleri tam sürüme sabitlendi. `astral-sh/setup-uv`'nin `v10`
# diye bir major etiketi yok (v7'den itibaren yalnızca tam sürüm etiketliyor),
# yani `@v10` koşu anında çözülemezdi.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aynı dalda peş peşe push olursa önceki koşuyu iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # .pre-commit-config.yaml ile aynı sürüm: yereldeki hook ile CI aynı
  # kuralları uygulasın.
  GITLEAKS_VERSION: 8.21.2

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Tüm geçmiş: gitleaks aşağıda commit geçmişini tarıyor, sığ klonda
          # yalnızca son commit görünür -- oysa sızan bir anahtar genelde eski
          # bir commit'te kalır.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked: uv.lock ile pyproject.toml ayrışmışsa burada kırılsın.
      # "Bende çalışıyordu"nun en sık sebebi, ve sessiz.
      - name: Bağımlılıklar
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      # Hiçbir secret verilmiyor: tests/conftest.py her testte MIA_API_KEY ve
      # EVDS_API_KEY'i ortamdan siliyor, `live` işaretli testler de varsayılan
      # olarak seçim dışı. Bir test ağa çıkmaya çalışırsa burada kırılır.
      - name: Testler
        run: uv run pytest --junit-xml=junit.xml

      # 21 test gerçek gold verisi olmadığında atlanıyor (gold repoda olduğu
      # için normalde hiçbiri atlanmaz). Biri o atlama koşulunu bozarsa BÜTÜN
      # testler atlanır ve bu iş yine yeşil yanar -- yani koruma sessizce
      # kaybolur. Aşağıdaki taban onu görünür kılıyor.
      # Sayı bir alt sınır: testler arttıkça yükseltilebilir, düşmesi ise
      # kasıtlı olmalı.
      #
      # `always()` yok: pytest kırıldıysa iş zaten kırmızı, üstelik junit.xml
      # yazılmadan çökmüşse bu adım anlamsız bir ayrıştırma hatası verirdi.
      - name: Sessiz atlama koruması
        run: |
          uv run python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          MIN_RUN = 500
          suite = ET.parse("junit.xml").getroot().find("testsuite")
          total = int(suite.get("tests"))
          skipped = int(suite.get("skipped"))
          ran = total - skipped
          print(f"{ran}/{total} test koştu, {skipped} atlandı")
          if ran < MIN_RUN:
              sys.exit(
                  f"Yalnızca {ran} test koştu (beklenen en az {MIN_RUN}). "
                  "Bir atlama koşulu bozulmuş olabilir."
              )
          PY

      # CLAUDE.md'nin pazarlıksız kuralı: hiçbir anahtar koda, teste, örneğe,
      # commit mesajına girmez.
      #
      # pre-commit hook'u üzerinden KOŞTURULMUYOR, bilerek: o hook'un komutu
      # `gitleaks protect --staged`, yani yalnızca commit edilmek üzere
      # stage'lenmiş değişikliği tarıyor. CI'da hiçbir şey stage'de olmadığı
      # için hiçbir şey taramaz ve her zaman yeşil yanar -- hiçbir şeyi
      # korumayan bir koruma. Burada `detect` kullanılıyor: tüm commit
      # geçmişini tarar. (Yereldeki `protect --staged` doğru olanıdır, çünkü
      # orada amaç commit'i engellemek.)
      - name: Sızan anahtar taraması
        run: |
          curl -sSfL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner
